services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local}
      POSTGRES_DB: app_dev
    ports:
      - "127.0.0.1:${ENCARGADO_POSTGRES_DATABASE_PORT:?Start through Encargado}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
